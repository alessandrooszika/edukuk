<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#16171d" rx="0" ry="0"/>

  <!-- Logo icon -->
  <rect x="505" y="175" width="80" height="80" rx="20" ry="20" fill="url(#grad)"/>
  <text x="545" y="233" font-family="Inter, system-ui, sans-serif" font-size="42" font-weight="800" fill="#fff" text-anchor="middle" dominant-baseline="middle">E</text>

  <!-- Logo text -->
  <text x="620" y="230" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">edukuk</text>

  <!-- Count -->
  <text x="600" y="340" font-family="Inter, system-ui, sans-serif" font-size="96" font-weight="800" fill="#c084fc" text-anchor="middle" letter-spacing="-2">60 componentes</text>

  <!-- Divider -->
  <rect x="560" y="370" width="80" height="4" rx="2" ry="2" fill="url(#dividerGrad)"/>

  <!-- Subtitle -->
  <text x="600" y="420" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="0.3">0 dependencias de UI externas</text>
</svg>
